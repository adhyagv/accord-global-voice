name: Accord CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      ACCORD_PERSISTENCE: memory
      PYTHONPATH: ${{ github.workspace }}/apps/api/src:${{ github.workspace }}/packages/sim/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q apps/api/src packages/sim/src tests
      - name: Run backend and API end-to-end tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Lint frontend
        run: npm run lint
